name: Build

on:
  push:
    branches: [ main, "agent/**", "claude/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Test, build, and verify plugin
        run: ./gradlew test buildPlugin verifyPlugin --no-daemon --stacktrace

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: copilot-agent-sync-intellij-${{ github.sha }}
          path: build/distributions/*.zip
          retention-days: 30
