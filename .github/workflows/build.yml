name: Build

on:
  push:
    branches: [ main, "agent/**", "claude/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build plugin
        run: ./gradlew build --no-daemon

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: copilot-agent-sync-intellij-${{ github.sha }}
          path: build/distributions/*.zip
          retention-days: 30
